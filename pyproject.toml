[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syncboard"
version = "0.1.0"
description = "Python interface for the evomachine SyncBoard (Teensy) serial controller."
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[tool.setuptools]
packages = ["syncboard"]
